apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: firstapp-hpa
  namespace: firstapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: firstapp-deployment
  minReplicas: 4
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization         # % of each pod's CPU *request*
        averageUtilization: 50    # e.g., 70% of 300m ≈ 210m per pod
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization         # % of each pod's memory *request*
        averageUtilization: 50    # e.g., 80% of 384Mi ≈ 307Mi per pod
#  behavior:                       # optional but recommended to avoid thrash
#    scaleUp:
#      stabilizationWindowSeconds: 0
#      policies:
#      - type: Percent
#        value: 100                # at most double per minute
#        periodSeconds: 60
#    scaleDown:
#      stabilizationWindowSeconds: 300
#      selectPolicy: Max
#      policies:
#      - type: Percent
#        value: 50                 # cut by at most 50% per minute
#        periodSeconds: 60


#Why behaviour matters (tiny scenario)
#Target CPU = 70%. Traffic spikes briefly to 200% → HPA wants 3× replicas, then traffic drops.
#With scaleUp cap = 100%/min, you go 3→6 (not 3→9) and watch again.
#With scaleDown window = 300s, HPA remembers the recent high need and waits 5 minutes before shrinking below that, preventing thrash back to 3 too soon.