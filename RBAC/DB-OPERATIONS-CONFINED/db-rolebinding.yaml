apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: db-ops-binding
  namespace: database
subjects:
  - kind: Group
    name: db-ops      #Make sure that db-ops will be the kubernetes group created while attaching IAM role to the EKS cluster
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: db-ops-role
  apiGroup: rbac.authorization.k8s.io