apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: db-ops-role
  namespace: database
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets","statefulsets/scale","statefulsets/status"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get","list","watch","update","patch","delete"]
  - apiGroups: [""]
    resources: ["pods/exec","pods/portforward","pods/log"]
    verbs: ["create","get"]
  - apiGroups: [""]
    resources: ["services","endpoints","configmaps","persistentvolumeclaims","events"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get","list","watch","create","update","patch"]