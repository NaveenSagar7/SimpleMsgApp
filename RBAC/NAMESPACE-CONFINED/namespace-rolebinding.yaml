# Binds a Kubernetes group to the namespaced admin Role.
# Replace: NAMESPACE_NAME with your namespace. Replace GROUP_NAME with the group from your EKS Access Entry (e.g., ns-admin).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ns-admin-binding
  namespace: NAMESPACE_NAME
subjects:
- kind: Group
  name: GROUP_NAME  # e.g., ns-admin #Make sure that this will be the kubernetes group created while attaching IAM role to the EKS cluster
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: ns-admin-role
  apiGroup: rbac.authorization.k8s.io

