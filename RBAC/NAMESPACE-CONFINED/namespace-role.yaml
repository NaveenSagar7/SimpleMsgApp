# Namespace-scoped admin Role (superuser) — grants all verbs on all resources within one namespace.
# Replace: NAMESPACE_NAME with your namespace (e.g., database)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ns-admin-role
  namespace: secondapp
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]

