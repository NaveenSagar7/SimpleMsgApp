apiVersion: v1
kind: LimitRange
metadata:
  name: firstapp-defaults
  namespace: firstapp
spec:
  limits:
  - type: Container
    # Defaults applied when a container omits resources:
    default:            # <- default *limits*
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:     # <- default *requests*
      cpu: "250m"
      memory: "256Mi"
    # Optional safety rails (keep or adjust as you like):
    max:
      cpu: "1"          # containers may not set limits above this
      memory: "1Gi"
    min:
      cpu: "100m"       # containers must request at least this
      memory: "128Mi"
