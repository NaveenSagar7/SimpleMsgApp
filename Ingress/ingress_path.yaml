#NOTE : THERE IS NO REGEX/REWRITE OPTION IN AWS ALB , LIKE IN NGNIX

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: firstapp
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip   # or "instance" if you use NodePort Services
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      #Order /second before / to keep matching unambiguous.
      - path: /me      # make sure your application server at /me instead of /
        pathType: Prefix
        backend:
          service:
            name: secondapp-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: firstapp-service
            port:
              number: 80

        



