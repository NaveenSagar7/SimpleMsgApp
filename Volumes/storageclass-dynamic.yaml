# Dynamic provisioning flow (no pv.yaml needed here):
# 1. StorageClass tells Kubernetes WHICH provisioner to call and HOW
#    (volume type, binding mode) whenever a PVC asks for this class.
# 2. PVC just requests storage + this className - it does NOT bind to
#    an existing PV. With volumeBindingMode: WaitForFirstConsumer, the
#    PVC stays Pending until a pod using it is scheduled; only then does
#    the provisioner create a real EBS volume and a matching PV object
#    for it automatically (named something like pvc-<uuid>), and binds
#    the PVC to that new PV. You never write the PV yourself.
# 3. The Deployment references the PVC exactly like the static examples
#    - it has no idea whether the PV behind it was created by hand or
#    provisioned dynamically.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-sc-dynamic
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: firstapp-pvc-dynamic
  namespace: firstapp
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-sc-dynamic
  resources:
    requests:
      storage: 5Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: firstapp-deployment-dynamic
  namespace: firstapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firstapp-web-dynamic
  template:
    metadata:
      labels:
        app: firstapp-web-dynamic
    spec:
      containers:
      - name: firstapp
        image: 149536497934.dkr.ecr.ap-south-1.amazonaws.com/firstapp:1.0
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: firstapp-storage
          mountPath: /usr/src/app/data
      volumes:
      - name: firstapp-storage
        persistentVolumeClaim:
          claimName: firstapp-pvc-dynamic
