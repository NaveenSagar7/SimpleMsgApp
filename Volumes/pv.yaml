# 1. hostPath PV - uses storage on the node's local filesystem.Only useful for single-node/dev clusters since the pod must land on
# the same node that holds the data (no cross-node availability).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: firstapp-pv-hostpath
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/data/firstapp

---

# 2. EBS PV - AWS EBS volume via the EBS CSI driver.
# ReadWriteOnce only (EBS can attach to a single node at a time), so this fits single-replica workloads like the app's database.
# volumeHandle must reference an EBS volume ID that already exists in
# the same AZ as the node the pod will be scheduled on.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: firstapp-pv-ebs
spec:
  capacity:
    storage: 5Gi 
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ebs-sc
  csi:
    driver: ebs.csi.aws.com
    volumeHandle: vol-0123456789abcdef0
    fsType: ext4

---

# 3. EFS PV - AWS EFS filesystem via the EFS CSI driver.
# ReadWriteMany - can be mounted by multiple pods/nodes at once, so
# it's the right choice when several replicas need to share the same
# files (e.g. uploaded content shared across app pods).
# volumeHandle must reference an EFS filesystem ID that already exists.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: firstapp-pv-efs
spec:
  capacity:
    storage: 5Gi #5Gi here 
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: efs-sc
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-0123456789abcdef0
